<main class="report-page">
  <section
    *ngIf="response"
    class="report-layout"
    [class.filter-open]="showFilter"
  >
    <header class="report-toolbar">
      <div class="report-heading">
        <h1>{{ response.title }}</h1>
        <span class="result-count">{{ filteredData.length }} dòng</span>
      </div>

      <div class="report-actions">
        <button
          type="button"
          class="toolbar-button toolbar-button-primary"
          (click)="showFilter = !showFilter"
          [title]="showFilter ? 'Ẩn bộ lọc' : 'Hiện bộ lọc'"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18l-7 8v6l-4 2v-8L3 4z" />
          </svg>
          <span>{{ "REPORT.FILTER" | translate }}</span>
        </button>

        <button
          type="button"
          class="toolbar-button"
          (click)="clearColumnFilters()"
          title="Xóa lọc cột"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4l16 16M10 10l-5-6h14l-5 6v4" />
          </svg>
          <span>Xóa lọc cột</span>
        </button>

        <app-file-handle
          #fileHandler
          [minimalMode]="true"
          [isFileHandle]="isFileHandle"
          [user]="userData"
          [controll]="controller"
          nameExport="Xuất báo cáo"
          [IsReport]="true"
          [exportData]="exportData"
          (importCompleted)="ngOnInit()"
        ></app-file-handle>
      </div>
    </header>

    <form
      *ngIf="showFilter"
      [formGroup]="filterForm"
      (ngSubmit)="onFilter()"
      class="filter-panel"
    >
      <div class="filter-grid">
        <div
          *ngFor="let field of response.filters"
          class="filter-field"
        >
          <label>
            {{ field.label }}
            <span *ngIf="field.required" class="required">*</span>
          </label>

          <input
            *ngIf="field.type === 'text' || field.type === 'number'"
            [type]="field.type"
            [formControlName]="field.key"
          />

          <input
            *ngIf="field.type === 'date'"
            type="date"
            [formControlName]="field.key"
          />

          <select
            *ngIf="field.type === 'select'"
            [formControlName]="field.key"
          >
            <option *ngFor="let opt of field.options" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>

          <app-lookup
            *ngIf="field.type === 'lookup' && lookupMap[field.key]"
            [multiple]="false"
            [value]="''"
            [disable]="false"
            [response]="lookupMap[field.key]"
            (valueChange)="onFieldValueChange($event, field)"
          ></app-lookup>
        </div>
      </div>

      <div class="filter-actions">
        <button type="submit" class="filter-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18l-7 8v6l-4 2v-8L3 4z" />
          </svg>
          Lọc dữ liệu
        </button>
        <button type="button" class="filter-reset" (click)="resetFilter()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6M5.5 15a7 7 0 0011.6 2.6L20 14M4 10l2.9-3.6A7 7 0 0118.5 9" />
          </svg>
          Đặt lại
        </button>
      </div>
    </form>

    <div class="report-table-shell">
      <table class="report-table">
        <thead>
          <tr class="column-heading-row">
            <ng-container *ngFor="let header of response.header">
              <th
                [style.width.px]="header.width"
                [style.min-width.px]="header.width"
                [class]="header.align"
              >
                {{ header.label | translate }}
              </th>
            </ng-container>
          </tr>
          <tr class="column-filter-row">
            <ng-container *ngFor="let header of response.header">
              <th
                [style.width.px]="header.width"
                [style.min-width.px]="header.width"
              >
                <input
                  type="text"
                  [(ngModel)]="columnFilters[header.key]"
                  [ngModelOptions]="{ standalone: true }"
                  (ngModelChange)="onColumnFilterChange()"
                  [placeholder]="'Lọc ' + header.label"
                />
              </th>
            </ng-container>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="
              let row of filteredData.slice((page - 1) * pageSize, page * pageSize);
              let i = index
            "
            [ngClass]="getRowClass(row)"
          >
            <ng-container *ngFor="let header of response.header">
              <td
                [style.width.px]="header.width"
                [style.min-width.px]="header.width"
                [class]="header.align"
              >
                {{ formatCell(row[header.key], header.format, header.type) }}
              </td>
            </ng-container>
          </tr>

          <tr *ngIf="filteredData.length === 0">
            <td [attr.colspan]="response.header.length" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h6l6 6v10a2 2 0 01-2 2z" />
              </svg>
              <strong>Không có dữ liệu</strong>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="report-footer">
      <div class="page-size-control">
        <span>Hiển thị</span>
        <select
          [(ngModel)]="pageSize"
          [ngModelOptions]="{ standalone: true }"
          (change)="onPageSizeChange()"
        >
          <option *ngFor="let size of pageSizeOptions" [value]="size">
            {{ size }}
          </option>
        </select>
        <span>dòng / trang</span>
      </div>

      <app-dynamic-pagination
        [totalItems]="filteredData.length"
        [itemsPerPage]="pageSize"
        [currentPage]="page"
        [showPageSizeSelector]="false"
        (pageChange)="onPageChange($event)"
      ></app-dynamic-pagination>
    </footer>
  </section>
</main>
