<article class="chart-card">
  <header class="chart-header">
    <div>
      <h2>{{ title }}</h2>
      <p>{{ subtitle }}</p>
    </div>
    <span class="chart-mark" [style.background]="color + '14'" [style.color]="color">
      <i [class]="chartType === 'line' ? 'fas fa-chart-line' : 'fas fa-chart-pie'"></i>
    </span>
  </header>

  <div class="line-chart" *ngIf="chartType === 'line'">
    <div class="chart-total">
      <span>Tổng trong kỳ</span>
      <strong>{{ formatValue(total) }}</strong>
    </div>
    <svg viewBox="0 0 400 190" preserveAspectRatio="none" class="line-svg" *ngIf="hasData; else emptyChart">
      <defs>
        <linearGradient [id]="'area-' + color.replace('#', '')" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" [attr.stop-color]="color" stop-opacity="0.24"></stop>
          <stop offset="100%" [attr.stop-color]="color" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <line *ngFor="let y of [45, 90, 135, 180]" x1="20" x2="380" [attr.y1]="y" [attr.y2]="y" class="grid-line"></line>
      <polygon [attr.points]="getAreaPoints()" [attr.fill]="'url(#area-' + color.replace('#', '') + ')'" class="area"></polygon>
      <polyline [attr.points]="getLinePoints()" fill="none" [attr.stroke]="color" stroke-width="3" vector-effect="non-scaling-stroke"></polyline>
      <circle *ngFor="let point of getLinePoints().split(' ')" [attr.cx]="point.split(',')[0]" [attr.cy]="point.split(',')[1]" r="4" [attr.fill]="color" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"></circle>
    </svg>
    <div class="chart-labels" *ngIf="hasData">
      <span *ngFor="let label of labels">{{ label }}</span>
    </div>
  </div>

  <div class="pie-chart" *ngIf="chartType === 'pie'">
    <ng-container *ngIf="hasData; else emptyChart">
      <div class="donut-wrap">
        <svg viewBox="0 0 200 200" class="pie-svg">
          <g transform="translate(100,100)">
            <path *ngFor="let slice of getPieSlices(); let i = index" [attr.d]="slice.path" [attr.fill]="getSliceColor(i)" stroke="#fff" stroke-width="3"></path>
            <circle cx="0" cy="0" r="47" fill="#fff"></circle>
          </g>
        </svg>
        <div class="donut-total"><strong>{{ formatValue(total) }}</strong><span>Tổng phiếu</span></div>
      </div>
      <div class="pie-legend">
        <div class="legend-item" *ngFor="let label of labels; let i = index">
          <span class="legend-color" [style.background]="getSliceColor(i)"></span>
          <span>{{ label }}</span>
          <strong>{{ formatValue(data[i] || 0) }}</strong>
        </div>
      </div>
    </ng-container>
  </div>

  <ng-template #emptyChart>
    <div class="empty-chart"><i class="fas fa-chart-simple"></i><span>Chưa có dữ liệu</span></div>
  </ng-template>
</article>
