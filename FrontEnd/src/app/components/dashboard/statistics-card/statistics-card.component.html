<article class="statistics-card" [style.--accent]="color">
  <div class="card-top">
    <span class="icon-container" [style.background]="color + '14'" [style.color]="color">
      <i [class]="icon"></i>
    </span>
    <span class="trend" [class.down]="!trendUp">
      <i [class]="trendUp ? 'fas fa-arrow-up' : 'fas fa-arrow-down'"></i>
      {{ trend | number:'1.0-1' }}%
    </span>
  </div>
  <span class="card-title">{{ title }}</span>
  <strong class="card-value">{{ value }}</strong>
  <div class="card-footer">
    <span>{{ caption }}</span>
    <small>{{ trendText }}</small>
  </div>
</article>
