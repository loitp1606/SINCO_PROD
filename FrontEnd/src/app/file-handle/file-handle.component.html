<!-- Nếu là chế độ đơn giản, chỉ hiện 2 nút -->
<div *ngIf="minimalMode" class="flex flex-wrap items-center gap-2">
  <ngx-spinner
    bdColor="rgba(0, 0, 0, 0.6)"
    size="medium"
    color="#fff"
    type="ball-clip-rotate-multiple"
    [fullScreen]="true">
    <p style="color: white; font-size: 20px; margin-top: 10px;">
      Đang xử lý, vui lòng chờ...
    </p>
  </ngx-spinner>

  <ng-container *ngIf="isFileHandle === 'import' || isFileHandle === 'both'">
     <!-- Import -->
    <div class="toolbar-file-wrapper toolbar-file-wrapper--import" #importMenu>
      <button #importButton (click)="toggleImportOptions()"
        class="toolbar-file-btn inline-flex items-center gap-2 rounded-md border border-emerald-200 bg-white px-3 py-1.5 text-sm font-medium text-emerald-700 hover:bg-emerald-50 transition">
        <mat-icon class="toolbar-icon">upload</mat-icon>
        {{ "COMMON.IMPORT" | translate }}
      </button>

      <!-- Dropdown Import -->
      <div *ngIf="showImportOptions"
        class="toolbar-file-menu toolbar-file-menu--import">
        <button type="button" class="toolbar-file-menu-item"
          (click)="selectImportType('template')">
          <mat-icon>download</mat-icon>
          <span>{{ "COMMON.DOWNLOAD_TEMPLATE" | translate }}</span>
        </button>
        <button type="button" class="toolbar-file-menu-item"
          (click)="selectImportType('import')">
          <mat-icon>upload_file</mat-icon>
          <span>{{ "COMMON.UPLOAD_FILE" | translate }}</span>
        </button>
      </div>

      <!-- Hidden input -->
      <input #importInput type="file" hidden accept=".csv, .xlsx, .xls"
        (change)="importCSV($event, user, controll, 'import')" />
    </div>
   </ng-container>

   <ng-container *ngIf="isFileHandle === 'export' || isFileHandle === 'both'">
    <!-- Export -->
    <div class="toolbar-file-wrapper toolbar-file-wrapper--export" #exportMenu>
      <button #exportButton (click)="toggleExportOptions()"
        class="toolbar-file-btn inline-flex items-center gap-2 rounded-md border border-cyan-200 bg-white px-3 py-1.5 text-sm font-medium text-cyan-700 hover:bg-cyan-50 transition">
        <mat-icon class="toolbar-icon">download</mat-icon>
        {{ nameExport | translate }}
      </button>

      <!-- Dropdown Export -->
      <div *ngIf="showExportOptions"
        class="toolbar-file-menu toolbar-file-menu--export">
        <button type="button" class="toolbar-file-menu-item"
          (click)="selectExportType('pdf')">
          <mat-icon>picture_as_pdf</mat-icon>
          <span>PDF</span>
        </button>
        <button type="button" class="toolbar-file-menu-item"
          (click)="selectExportType('excel')">
          <mat-icon>grid_on</mat-icon>
          <span>Excel</span>
        </button>
        <button type="button" class="toolbar-file-menu-item"
          (click)="exportRawMasterToExcel()">
          <mat-icon>table_view</mat-icon>
          <span>Kết xuất</span>
        </button>
        <button
          *ngIf="enableTaxExcelExport"
          type="button"
          class="toolbar-file-menu-item"
          (click)="selectExportType('excel-tax')"
        >
          <mat-icon>receipt_long</mat-icon>
          <span>Excel PM Thuế</span>
        </button>
        <button
          *ngIf="enableTaxExcelExport && extraTaxExcelExportLabel"
          type="button"
          class="toolbar-file-menu-item"
          (click)="selectExportType('excel-tax', extraTaxExcelExportConfig)"
        >
          <mat-icon>receipt_long</mat-icon>
          <span>{{ extraTaxExcelExportLabel }}</span>
        </button>
        <button type="button" class="toolbar-file-menu-item"
          (click)="selectExportType('word')">
          <mat-icon>description</mat-icon>
          <span>Word</span>
        </button>
      </div>
    </div>
  </ng-container>
</div>

<div *ngIf="!minimalMode">
  <div class="file-handle-container">
    <h2 class="title">Quản lý dữ liệu</h2>
    <div class="import-form-wrapper">
      <!-- Nhập tên bảng -->
      <input matInput [(ngModel)]="controll" placeholder="Nhập tên bảng" class="custom-input" />

      <!-- Nút Import + Export -->
      <div class="action-buttons-wrapper">
        <!-- Input file ẩn -->
        <input type="file" id="importFile" style="display: none" accept=".csv, .xlsx, .xls"
          (change)="importCSV($event, user, controll, 'template')" />

        <!-- Nút Import -->
        <button mat-stroked-button color="accent" [disabled]="!controll" (click)="triggerImport('import')">
          <mat-icon>upload</mat-icon>
          Import Excel
        </button>

        <!-- Nút Export -->
        <div class="export-wrapper">
          <button mat-stroked-button color="accent" (click)="toggleExportOptions()">
            <mat-icon>download</mat-icon>
            Export
          </button>

          <!-- Dropdown -->
          <div *ngIf="showExportOptions" class="export-dropdown">
            <button mat-button (click)="exportToReport(controll, 'pdf')">
              <mat-icon>picture_as_pdf</mat-icon> PDF
            </button>
            <button mat-button (click)="exportToReport(controll, 'excel')">
              <mat-icon>grid_on</mat-icon> Excel
            </button>
            <button mat-button (click)="exportRawMasterToExcel()">
              <mat-icon>table_view</mat-icon> Kết xuất
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
</div>
